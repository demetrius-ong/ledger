<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<meta name="description" content="Ryu's monthly spending tracker">
<meta name="theme-color" content="#05071A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>

@import url("https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap");
:root{
  color-scheme:dark;
  --void:#05071A; --deep:#0A0F2B; --panel:rgba(18,25,64,.72); --panel-solid:#121940; --panel-2:rgba(38,48,104,.55);
  --ink:#E9ECFF; --muted:#8E97C7; --line:rgba(140,155,230,.18);
  --accent:#6BE4F7; --accent-ink:#04202A; --accent-soft:rgba(107,228,247,.14);
  --save:#C09BFF; --save-ink:#1C0E3A; --save-soft:rgba(192,155,255,.15);
  --earn:#7DF0AE; --earn-ink:#062A17; --earn-soft:rgba(125,240,174,.14);
  --danger:#FF7A8A; --glow:0 0 0 1px rgba(107,228,247,.25),0 10px 40px rgba(60,90,255,.18);
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--void)}
body{background:radial-gradient(1200px 600px at 85% -10%,#2A1B5E 0%,transparent 60%),radial-gradient(900px 500px at -10% 30%,#0E2F5A 0%,transparent 55%),var(--void);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px;color:var(--accent)}
.month-nav{display:flex;align-items:center;gap:4px}
.month-nav .lbl{font-family:var(--display);font-weight:500;min-width:118px;text-align:center;letter-spacing:.03em}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg{width:16px;height:16px}

.total{position:relative;overflow:hidden;display:block;width:100%;text-align:left;border:1px solid rgba(107,228,247,.35);background:linear-gradient(135deg,rgba(40,70,170,.55),rgba(90,40,160,.45));border-radius:18px;padding:18px 20px 16px;box-shadow:var(--glow)}
.total::after{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8FE9FF 0%,#3A6BE0 38%,#23145A 70%);opacity:.55;box-shadow:0 0 60px rgba(107,228,247,.35)}
.total::before{content:"";position:absolute;right:-92px;top:22px;width:250px;height:34px;border-radius:50%;border:2px solid rgba(192,155,255,.45);transform:rotate(-18deg);z-index:1}
.total > *{position:relative;z-index:2}
.total .k{font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent)}
.total .v{font-family:var(--display);font-weight:700;font-size:48px;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(107,228,247,.35)}
.total .v small{font-size:26px;opacity:.75}
.total .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:8px}
.total .meta span:last-child{color:var(--ink)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.act{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);border-radius:14px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:10px;font-weight:600}
.act .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:18px;font-weight:500}
.act.one .dot{background:var(--accent-soft);color:var(--accent)}
.act.sv .dot{background:var(--save-soft);color:var(--save)}
.act small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.saved-tab{text-align:left;margin-top:10px;width:100%;border:1px dashed rgba(192,155,255,.55);background:rgba(20,14,50,.5);color:var(--save);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.saved-tab .count{font-family:var(--mono);font-size:13px;background:var(--save-soft);padding:2px 9px;border-radius:99px}

h2{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
h2 span{font-family:var(--body);letter-spacing:0;text-transform:none;font-size:13px}
.list{background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cat{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat-open{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px}
.cat-open:hover{background:var(--panel-2)}
.cat .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cat .name{font-weight:500;overflow-wrap:anywhere}
.cat .sub{font-size:12px;color:var(--muted)}
.cat .track{height:5px;border-radius:99px;background:rgba(140,155,230,.12);margin-top:8px;overflow:hidden}
.cat .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#4E7BFF,var(--accent));box-shadow:0 0 10px rgba(107,228,247,.5)}
.cat-edit{flex:1;display:flex;gap:6px;padding:8px 6px;flex-wrap:wrap;align-items:center}
.cat-edit input{flex:1;min-width:140px}
.cat-warn{flex:1;padding:10px;font-size:13px}
.cat-warn b{color:var(--danger)}
.cat-warn .confirm{margin-top:8px}
.total{padding:0}
.total-main{display:block;width:100%;border:0;background:transparent;text-align:left;padding:18px 20px 14px;color:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(140,155,230,.25)}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 20px 14px;border:0;background:transparent;text-align:left;color:inherit}
.stat + .stat{border-left:1px solid rgba(140,155,230,.25)}
button.stat:hover,.total-main:hover{background:rgba(255,255,255,.04)}
.stat .sk{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.stat .sv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
.earn{color:var(--earn)}
.pos{color:var(--earn)}
.neg{color:var(--danger)}
.act.ea{grid-column:1 / -1}
.act.ea .dot{background:var(--earn-soft);color:var(--earn)}
.h-add{border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:99px;padding:4px 12px;font-family:var(--body);font-size:13px;letter-spacing:0;text-transform:none;font-weight:600}
.h-add:hover{border-color:var(--accent)}
.sheet.income .btn.primary{background:var(--earn);border-color:var(--earn);color:var(--earn-ink)}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}

.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px 0;display:inline-flex;gap:6px;align-items:center}
.back svg{width:16px;height:16px}
.vhead{margin:8px 2px 16px}
.vhead .t{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em}
.vhead .s{color:var(--muted);font-size:14px}
.vhead .s b{color:var(--ink);font-family:var(--mono);font-weight:500}
.day{font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:16px 4px 6px}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:500;overflow-wrap:anywhere}
.item .sub{font-size:12px;color:var(--muted)}
.item .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.tools{display:flex;gap:4px;flex:none}
.mini{border:1px solid var(--line);background:rgba(10,15,43,.6);border-radius:8px;height:30px;padding:0 9px;font-size:12px;color:var(--muted)}
.mini:hover{color:var(--ink);border-color:rgba(140,155,230,.4)}
.mini.del:hover{color:var(--danger);border-color:var(--danger)}
.mini.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.confirm{display:flex;gap:4px}
.confirm .yes{background:var(--danger);color:#2A0710;border-color:var(--danger);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--save-soft);color:var(--save);margin-left:6px;vertical-align:1px}

.sv-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.sv-item:first-child{border-top:0}
.sv-add{flex:1;min-width:0;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px;padding:4px 2px}
.sv-add .plus{width:34px;height:34px;flex:none;border-radius:10px;background:var(--save-soft);color:var(--save);display:grid;place-items:center;font-size:20px}
.sv-add .main{flex:1;min-width:0}
.sv-add .name{font-weight:500}
.sv-add .sub{font-size:12px;color:var(--muted)}
.sv-add.done .plus{background:var(--accent);color:var(--accent-ink)}

.scrim{position:fixed;inset:0;background:rgba(2,3,12,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:linear-gradient(180deg,#141B47,#0C1133);border:1px solid var(--line);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;box-shadow:var(--glow)}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-family:var(--display);font-size:21px;margin:0 0 2px;letter-spacing:.03em}
.sheet .hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.field{margin-bottom:16px}
.field > label,.field > .lab{display:block;font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(38,48,104,.45);border-radius:99px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.sheet.saving .chip[aria-pressed="true"]{background:var(--save);border-color:var(--save);color:var(--save-ink)}
.chip.new{border-style:dashed;color:var(--muted);background:transparent}
input[type=text],input[type=number],input[type=datetime-local]{width:100%;border:1px solid var(--line);background:rgba(5,7,26,.6);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.amount-in{position:relative}
.amount-in span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--mono);color:var(--muted);font-size:22px}
.amount-in input{font-family:var(--mono);font-size:26px;padding:10px 12px 10px 34px}
.newcat{display:flex;gap:6px;margin-top:8px}
.newcat input{flex:1}
.btnrow{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;border-radius:12px;padding:13px;font-weight:600;border:1px solid var(--line);background:rgba(38,48,104,.45)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sheet.saving .btn.primary{background:var(--save);border-color:var(--save);color:var(--save-ink)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:0 0 6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-solid);border:1px solid rgba(107,228,247,.4);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:var(--glow)}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
@media (prefers-reduced-motion:no-preference){.sheet.enter{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}


input[type=email],input[type=password],textarea{width:100%;border:1px solid var(--line);background:rgba(5,7,26,.6);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
textarea{font-family:var(--mono);font-size:12px;resize:vertical}
input[type=file]{color:var(--muted);font-size:13px;max-width:100%}
.linkbtn{border:0;background:transparent;color:var(--accent);padding:2px 0;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.acct{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;overflow-wrap:anywhere}
.auth{max-width:400px;margin:0 auto;padding-block:12vh 40px}
.brand.big{font-size:30px;justify-content:center}
.brand.big svg{width:32px;height:32px}
.auth-sub{text-align:center;color:var(--muted);margin:10px 0 22px}
.auth-card{background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:var(--glow)}
.btn.wide{width:100%}
.btn:disabled{opacity:.6}
.auth-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.hint.small{font-size:12px;color:var(--muted);margin-top:4px}
.wrap{padding-top:calc(18px + env(safe-area-inset-top,0px))}

/* ---- v2: period switcher, tab bar, budgets, averages, recurring, add menu ---- */
.wrap{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:7px 0;font-size:13px;font-weight:600}
.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 45%;padding:8px 4px}
h2 .seg.sm{display:inline-flex;margin:0;padding:2px;text-transform:none;letter-spacing:0;font-family:var(--body)}
h2 .seg.sm button{flex:none;padding:3px 9px;font-size:11px}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pnav .lbl{font-family:var(--display);font-weight:500;font-size:16px;letter-spacing:.03em;display:flex;align-items:center;gap:8px;text-align:center}
.today{border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:99px;font-size:11px;padding:2px 9px;font-family:var(--body);font-weight:600}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs-in{pointer-events:auto;max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(12,17,48,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tab{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 0;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.fab{justify-self:center;width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,#6BE4F7,#8A93FF);color:#04202A;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(5,7,26,.95),0 6px 22px rgba(107,228,247,.45);margin-top:-24px}
.fab svg{width:26px;height:26px}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.bcard{background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bcard.ended{opacity:.65}
.bmain{display:block;width:100%;text-align:left;border:0;background:transparent;padding:14px 16px 8px;color:inherit}
.bmain:hover{background:var(--panel-2)}
.bcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bcard .name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.bcard .sub{font-size:12px;color:var(--muted);margin-top:2px}
.bnum{margin-top:10px;color:var(--muted);font-size:14px}
.bnum .big{font-family:var(--display);font-weight:700;font-size:28px;color:var(--ink);margin-right:2px;font-variant-numeric:tabular-nums}
.bnum .big.neg{color:var(--danger)}
.bcard .track{border-radius:99px;background:rgba(140,155,230,.12);overflow:hidden}
.bcard .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#4E7BFF,var(--accent));box-shadow:0 0 10px rgba(107,228,247,.5)}
.track.big{height:8px;margin:10px 0 8px}
.fill.warn{background:linear-gradient(90deg,#FFB86B,#FFD48A);box-shadow:none}
.fill.over{background:var(--danger);box-shadow:none}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;background:rgba(140,155,230,.14);color:var(--muted);font-weight:600;white-space:nowrap}
.pill.ok{background:var(--earn-soft);color:var(--earn)}.pill.warn{background:rgba(255,184,107,.15);color:#FFC983}.pill.over{background:rgba(255,122,138,.15);color:var(--danger)}
.bfoot{display:flex;justify-content:flex-end;gap:4px;padding:0 12px 12px}
.presets{margin-bottom:10px}
.daterow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.daterow label{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-family:var(--display);min-width:0}
input[type=date]{width:100%;min-width:0;border:1px solid var(--line);background:rgba(5,7,26,.6);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;font-size:15px;letter-spacing:0;text-transform:none;font-family:var(--body)}
.total-main.static{cursor:default}
.total .v.sm{font-size:38px}
.tiles{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(140,155,230,.25);position:relative;z-index:2}
.tile{padding:10px 20px 12px;display:flex;flex-direction:column;gap:2px}
.tile:nth-child(even){border-left:1px solid rgba(140,155,230,.25)}
.tile:nth-child(n+3){border-top:1px solid rgba(140,155,230,.25)}
.tile .sk,.mini-stats .sk{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.tile .sv,.mini-stats .sv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini-stats>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.cat.static{padding:4px}
.cat.static .cat-open{cursor:default}
.cat.static .cat-open:hover{background:transparent}
.note{font-size:12px;color:var(--muted);margin:12px 4px 0;line-height:1.5}
.item.paused{opacity:.55}
.tag.rec{background:var(--accent-soft);color:var(--accent)}
.sheet > .lab{display:block;font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.addgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
.addopt{border:1px solid var(--line);background:rgba(38,48,104,.45);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:13px;text-align:center;line-height:1.25}
.addopt:hover{border-color:rgba(140,155,230,.45)}
.addopt .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;font-weight:500}
.addopt.one .dot{background:var(--accent-soft);color:var(--accent)}
.addopt.ea .dot{background:var(--earn-soft);color:var(--earn)}
.addopt.sv .dot{background:var(--save-soft);color:var(--save)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qchip{border:1px solid rgba(192,155,255,.35);background:var(--save-soft);color:var(--ink);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:baseline;font-size:14px}
.qchip b{font-family:var(--mono);color:var(--save);font-weight:500}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:12px}
.btn.slim{flex:none;padding:10px 14px}
.mt{margin-top:14px}
.mt8{margin-top:8px}
.sv-add .sub{display:block}

/* ---- v3: spending line, search, repeating budgets ---- */
.spark{position:relative;z-index:2;padding:0 20px 12px}
.spark.up{color:var(--danger)}.spark.down{color:var(--earn)}.spark.flat{color:var(--muted)}
.spark-read{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.spark-read .sk{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.spark-read .sv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:currentColor}
#spark{display:block;width:100%;height:84px;overflow:visible;touch-action:none;cursor:crosshair}
#spark .ln{stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px currentColor)}
#spark .base{stroke:rgba(140,155,230,.4);stroke-width:1;stroke-dasharray:3 4}
#spark .cross{stroke:rgba(233,236,255,.45);stroke-width:1}
#spark circle{fill:currentColor;stroke:#0A0F2B;stroke-width:2}
.top .icon-btn svg{width:18px;height:18px}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:10px 0 12px}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox svg{width:18px;height:18px;color:var(--muted);flex:none}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:13px 0;outline:none}
.res-sum{color:var(--muted);font-size:14px;margin:0 4px 4px}
.res-sum b{color:var(--ink);font-family:var(--mono);font-weight:500}
.res-sum b.earn{color:var(--earn)}
.rep{color:var(--accent)}
.bcard .sub.prev{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.sub .neg{color:var(--danger)}
.hint.small{font-size:12px;color:var(--muted);margin:6px 0 0}

body{margin:0}
</style>
</head>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<nav id="tabs" hidden aria-label="Sections"></nav>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
